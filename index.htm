<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOREX CLOUD CCTV - Direct Stream Push System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC Signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-blue-900/40">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            <h1 class="cyber-font text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                ZOREX <span class="text-xs text-cyan-300 border border-cyan-500/40 px-2 py-0.5 rounded ml-2">CCTV ROOM SYSTEM</span>
            </h1>
        </div>
        <div id="connection-status" class="text-xs font-mono px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/30">
            Initializing...
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Left / Control Panel -->
        <div class="glass-panel rounded-2xl p-5 flex flex-col space-y-5 lg:col-span-1 h-fit">
            <h2 class="cyber-font text-base font-semibold text-cyan-300 border-b border-gray-800 pb-3">
                <i class="fa-solid fa-sliders mr-2"></i> Control Center
            </h2>

            <!-- Mode Selection Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-gray-900/80 p-1.5 rounded-xl border border-gray-800">
                <button id="tab-host" onclick="switchMode('host')" class="py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg">
                    <i class="fa-solid fa-server mr-1"></i> Host (Hub)
                </button>
                <button id="tab-cam" onclick="switchMode('cam')" class="py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-video mr-1"></i> Cam Node
                </button>
            </div>

            <!-- Host / Control Hub Panel -->
            <div id="section-host" class="flex flex-col space-y-4">
                <div class="bg-blue-950/30 border border-blue-900/50 p-3.5 rounded-xl space-y-2">
                    <label class="block text-[11px] font-mono text-cyan-400 uppercase tracking-wider">CCTV Room ID (Host)</label>
                    <input type="text" id="host-room-id" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-cyan-300 font-mono text-sm focus:outline-none" value="zorex-room-01">
                    <button onclick="createCCTVRoom()" class="w-full py-2 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold rounded-lg transition text-xs">
                        Create & Open Room
                    </button>
                </div>

                <!-- Incoming Connection Requests Box -->
                <div class="bg-gray-900/90 border border-gray-800 p-3 rounded-xl space-y-2">
                    <label class="block text-[11px] font-mono text-yellow-400 uppercase tracking-wider"><i class="fa-solid fa-bell mr-1"></i> Incoming Requests</label>
                    <div id="requests-container" class="space-y-2 max-h-40 overflow-y-auto text-xs text-gray-400 font-mono">
                        <p class="text-gray-500 text-center py-2">No pending requests...</p>
                    </div>
                </div>
            </div>

            <!-- Cam Node Panel -->
            <div id="section-cam" class="hidden flex flex-col space-y-4">
                <div class="bg-blue-950/30 border border-blue-900/50 p-3.5 rounded-xl space-y-3">
                    <div>
                        <label class="block text-[11px] font-mono text-cyan-400 uppercase tracking-wider mb-1">කැමරා නම (Cam ID)</label>
                        <input type="text" id="cam-node-id" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-cyan-300 font-mono text-sm focus:outline-none" value="cam-1">
                    </div>
                    <div>
                        <label class="block text-[11px] font-mono text-cyan-400 uppercase tracking-wider mb-1">Host Room ID එක දෙන්න</label>
                        <input type="text" id="target-host-id" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-cyan-300 font-mono text-sm focus:outline-none" value="zorex-room-01">
                    </div>
                    <button onclick="sendJoinRequest()" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 text-gray-950 font-bold rounded-lg transition text-xs shadow-lg">
                        <i class="fa-solid fa-paper-plane mr-1"></i> Send Join Request
                    </button>
                </div>

                <div class="flex flex-col space-y-2">
                    <button onclick="startCamera()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-gray-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-play"></i> <span>Start Camera Stream</span>
                    </button>
                    <button onclick="flipCamera()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl transition text-xs flex items-center justify-center space-x-2 border border-gray-700">
                        <i class="fa-solid fa-camera-rotate"></i> <span>Flip Camera</span>
                    </button>
                    <p class="text-[10px] text-cyan-300/80 text-center mt-1"><i class="fa-solid fa-shield-halved"></i> Minimize කළත්, වෙනත් App වලට ගියත්, Screen එක Off වුණත් කැමරාව දිගටම ක්‍රියාත්මක වේ.</p>
                </div>
            </div>
        </div>

        <!-- Right / 6-Camera Grid Display Panel -->
        <div class="glass-panel rounded-2xl p-4 md:p-6 flex flex-col lg:col-span-3">
            <h2 class="cyber-font text-sm font-semibold text-cyan-300 mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-video mr-2"></i> CCTV Room Grid (Slots 1 - 6)</span>
                <span class="text-xs text-gray-400 font-mono">Status: <span id="grid-status" class="text-emerald-400">Room Ready</span></span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 flex-1">
                <script>
                    for(let i=1; i<=6; i++) {
                        document.write(`
                            <div class="relative rounded-xl overflow-hidden bg-gray-950 border border-gray-800 min-h-[220px] flex items-center justify-center">
                                <div id="placeholder-${i}" class="text-center p-4">
                                    <i class="fa-solid fa-video-slash text-3xl text-gray-700 mb-2"></i>
                                    <p class="text-gray-500 text-xs font-mono">SLOT ${i} (Empty)</p>
                                </div>
                                <video id="video-${i}" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                                <div id="label-${i}" class="absolute top-2 left-2 bg-black/70 px-2 py-0.5 rounded text-[10px] font-mono text-cyan-400 border border-white/10 hidden">SLOT ${i}</div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    </main>

    <!-- Hidden Media Elements -->
    <video id="local-video" autoplay playsinline muted class="hidden"></video>
    <audio id="silent-audio" loop class="hidden">
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <!-- App Logic Script -->
    <script>
        let peer = null;
        let myStream = null;
        let currentFacingMode = 'environment';
        let silentAudioCtx = null;
        let currentMode = 'host';
        let pendingConnections = {};
        let wakeLock = null;

        const peerOptions = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        // --- HOST LOGIC ---
        function initHostPeer(roomId) {
            if (peer) { try { peer.destroy(); } catch(e) {} }

            peer = new Peer(roomId, peerOptions);

            peer.on('open', (id) => {
                updateStatus('Host Room Active: ' + id, 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30');
            });

            peer.on('error', (err) => {
                console.error("Host Error:", err);
                if (err.type === 'unavailable-id') {
                    alert("මෙම Room ID එක දැනටමත් භාවිතයේ ඇත. වෙනත් නමක් දෙන්න.");
                }
                updateStatus('Error: ' + err.type, 'bg-red-500/10 text-red-400 border-red-500/30');
            });

            peer.on('connection', (conn) => {
                conn.on('open', () => {
                    conn.on('data', (data) => {
                        if (data.type === 'JOIN_REQUEST') {
                            pendingConnections[conn.peer] = { conn: conn, camId: data.camId };
                            addIncomingRequest(conn.peer, data.camId);
                        }
                    });
                });
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    let camLabel = call.peer;
                    for (let pId in pendingConnections) {
                        if (pendingConnections[pId].conn.peer === call.peer) {
                            camLabel = pendingConnections[pId].camId;
                            break;
                        }
                    }
                    assignStreamToNextSlot(camLabel, remoteStream);
                });
            });
        }

        function createCCTVRoom() {
            const roomId = document.getElementById('host-room-id').value.trim();
            if (!roomId) {
                alert("කරුණාකර Room ID එකක් ඇතුළත් කරන්න!");
                return;
            }
            initHostPeer(roomId);
            alert("CCTV Room created successfully: " + roomId);
        }

        function addIncomingRequest(peerId, camId) {
            const container = document.getElementById('requests-container');
            if (container.querySelector('p')) {
                container.innerHTML = '';
            }

            if (document.getElementById(`req-${peerId}`)) return;

            const reqDiv = document.createElement('div');
            reqDiv.id = `req-${peerId}`;
            reqDiv.className = "flex items-center justify-between bg-gray-800 p-2 rounded-lg border border-gray-700";
            reqDiv.innerHTML = `
                <span class="text-cyan-300">${camId}</span>
                <button onclick="acceptCamera('${peerId}', '${camId}')" class="px-3 py-1 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-bold rounded text-xs transition">
                    Accept
                </button>
            `;
            container.appendChild(reqDiv);
        }

        function acceptCamera(peerId, camId) {
            const reqData = pendingConnections[peerId];
            if (reqData && reqData.conn) {
                reqData.conn.send({ type: 'ACCEPT_REQUEST' });
                alert(`${camId} accepted! Waiting for camera stream...`);
                
                const reqEl = document.getElementById(`req-${peerId}`);
                if (reqEl) reqEl.remove();
            } else {
                alert("Connection reference not found.");
            }
        }

        // --- CAM NODE LOGIC ---
        function sendJoinRequest() {
            const camId = document.getElementById('cam-node-id').value.trim();
            const hostId = document.getElementById('target-host-id').value.trim();

            if (!camId || !hostId) {
                alert("කරුණාකර Cam ID සහ Host Room ID දෙකම දෙන්න!");
                return;
            }

            if (peer) { try { peer.destroy(); } catch(e) {} }

            peer = new Peer(peerOptions);

            peer.on('open', (id) => {
                updateStatus('Connecting to Host...', 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30');
                
                const conn = peer.connect(hostId);
                
                conn.on('open', () => {
                    conn.send({ type: 'JOIN_REQUEST', camId: camId });
                    updateStatus('Join Request Sent! Waiting for Host Accept...', 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30');
                    alert("Join Request sent to Host! Please wait for Host to Accept.");
                });

                conn.on('data', (data) => {
                    if (data.type === 'ACCEPT_REQUEST') {
                        updateStatus('Host Accepted! Streaming...', 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30');
                        
                        if (myStream) {
                            const call = peer.call(hostId, myStream);
                            call.on('error', (err) => {
                                console.error("Stream push error:", err);
                                alert("Stream push error: " + err);
                            });
                            alert("Host accepted! Camera stream is now broadcasting live.");
                        } else {
                            alert("Host accepted, but Camera is not started yet! Please click 'Start Camera Stream'.");
                        }
                    }
                });

                conn.on('error', (err) => {
                    alert("Host වෙත සම්බන්ධ වීම අසාර්ථකයි!");
                });
            });
        }

        // Prevent duplicates: Check if camera is already assigned to a slot
        function assignStreamToNextSlot(labelName, stream) {
            for (let i = 1; i <= 6; i++) {
                const labelEl = document.getElementById(`label-${i}`);
                if (labelEl && labelEl.innerText === labelName && !labelEl.classList.contains('hidden')) {
                    const videoEl = document.getElementById(`video-${i}`);
                    videoEl.srcObject = stream;
                    return;
                }
            }

            for (let i = 1; i <= 6; i++) {
                const videoEl = document.getElementById(`video-${i}`);
                const placeholderEl = document.getElementById(`placeholder-${i}`);
                const labelEl = document.getElementById(`label-${i}`);

                if (videoEl.srcObject === null || placeholderEl.classList.contains('hidden') === false) {
                    videoEl.srcObject = stream;
                    videoEl.classList.remove('hidden');
                    placeholderEl.classList.add('hidden');
                    labelEl.innerText = labelName;
                    labelEl.classList.remove('hidden');
                    document.getElementById('grid-status').innerText = `Active Feed: ${labelName}`;
                    break;
                }
            }
        }

        function updateStatus(text, cssClass) {
            const badge = document.getElementById('connection-status');
            badge.className = `text-xs font-mono px-3 py-1 rounded-full border ${cssClass}`;
            badge.innerText = text;
        }

        function switchMode(mode) {
            currentMode = mode;
            const tabHost = document.getElementById('tab-host');
            const tabCam = document.getElementById('tab-cam');
            const secHost = document.getElementById('section-host');
            const secCam = document.getElementById('section-cam');

            if (mode === 'host') {
                tabHost.className = "py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg";
                tabCam.className = "py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white";
                secHost.classList.remove('hidden');
                secCam.classList.add('hidden');
                createCCTVRoom();
            } else {
                tabCam.className = "py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg";
                tabHost.className = "py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white";
                secCam.classList.remove('hidden');
                secHost.classList.add('hidden');
            }
        }

        async function startCamera() {
            try {
                if (myStream) {
                    myStream.getTracks().forEach(track => track.stop());
                }

                // High compatibility constraints for background streaming
                myStream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode, 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 },
                        frameRate: { ideal: 24, max: 30 }
                    },
                    audio: true
                });

                const localVideo = document.getElementById('local-video');
                localVideo.srcObject = myStream;
                
                playSilentAudio();
                requestWakeLock();

                alert("Camera Started Successfully! You can now minimize browser or switch apps.");
            } catch (err) {
                console.error(err);
                alert("Camera Error: " + err.message);
            }
        }

        // Background Keep-Alive Audio Trick
        function playSilentAudio() {
            const audioEl = document.getElementById('silent-audio');
            audioEl.play().catch(e => console.log("Audio autoplay restricted:", e));

            if (!silentAudioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                silentAudioCtx = new AudioContext();
                const oscillator = silentAudioCtx.createOscillator();
                const gainNode = silentAudioCtx.createGain();
                gainNode.gain.value = 0.01;
                oscillator.connect(gainNode);
                gainNode.connect(silentAudioCtx.destination);
                oscillator.start();
            }
        }

        // Screen Wake Lock API to prevent device from sleeping / pausing camera tracks
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock was released');
                    });
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        // Re-acquire wake lock if visibility changes back to visible
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        async function flipCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            if (myStream) {
                await startCamera();
            }
        }

        window.onload = () => {
            switchMode('host');
        };
    </script>
</body>
</html>

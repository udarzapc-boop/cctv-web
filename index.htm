<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOREX CLOUD CCTV - 6 Cam Control System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC Signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: #030712;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass-panel {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-blue-900/40">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
            <h1 class="cyber-font text-xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                ZOREX <span class="text-xs text-cyan-300 border border-cyan-500/40 px-2 py-0.5 rounded ml-2">CCTV CONTROL ROOM</span>
            </h1>
        </div>
        <div id="connection-status" class="text-xs font-mono px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/30">
            Connecting to Cloud...
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Left / Control Panel -->
        <div class="glass-panel rounded-2xl p-5 flex flex-col space-y-5 lg:col-span-1 h-fit">
            <h2 class="cyber-font text-base font-semibold text-cyan-300 border-b border-gray-800 pb-3">
                <i class="fa-solid fa-sliders mr-2"></i> Control Center
            </h2>

            <!-- Mode Selection Tabs -->
            <div class="grid grid-cols-2 gap-2 bg-gray-900/80 p-1.5 rounded-xl border border-gray-800">
                <button id="tab-cam" onclick="switchMode('cam')" class="py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg">
                    <i class="fa-solid fa-video mr-1"></i> Cam Node
                </button>
                <button id="tab-viewer" onclick="switchMode('viewer')" class="py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-desktop mr-1"></i> Control Hub
                </button>
            </div>

            <!-- Cam Node Settings -->
            <div id="section-cam" class="flex flex-col space-y-4">
                <div class="bg-blue-950/30 border border-blue-900/50 p-3.5 rounded-xl space-y-2">
                    <label class="block text-[11px] font-mono text-cyan-400 uppercase tracking-wider">කැමරා ID එක දෙන්න (cam-1 සිට cam-6)</label>
                    <input type="text" id="custom-my-id" placeholder="උදා: cam-1" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-cyan-300 font-mono text-sm focus:border-cyan-400 focus:outline-none" value="cam-1">
                    <button onclick="registerCustomId()" class="w-full py-2 bg-cyan-500 hover:bg-cyan-400 text-gray-950 font-bold rounded-lg transition text-xs">
                        Set / Reconnect ID
                    </button>
                </div>

                <div class="flex flex-col space-y-2">
                    <button onclick="startCamera()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-gray-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-play"></i> <span>Start Camera Stream</span>
                    </button>
                    <button onclick="flipCamera()" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl transition text-xs flex items-center justify-center space-x-2 border border-gray-700">
                        <i class="fa-solid fa-camera-rotate"></i> <span>Flip Camera</span>
                    </button>
                    <p class="text-[10px] text-cyan-300/80 text-center mt-1"><i class="fa-solid fa-shield-halved"></i> Minimize කළත් කැමරාව දිගටම ක්‍රියාත්මක වේ.</p>
                </div>
            </div>

            <!-- Viewer Hub Settings -->
            <div id="section-viewer" class="hidden flex flex-col space-y-4">
                <div class="bg-blue-950/30 border border-blue-900/50 p-3.5 rounded-xl space-y-3">
                    <p class="text-[11px] text-gray-300">Control Hub එකෙන් කැමරා 6ම එකවර Connect කරගැනීමට පහත බොත්තම ඔබන්න:</p>
                    <button onclick="connectAllCams()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-gray-950 font-bold rounded-xl shadow-lg transition flex items-center justify-center space-x-2 text-sm">
                        <i class="fa-solid fa-satellite-dish"></i> <span>Connect All 6 Cams</span>
                    </button>
                </div>
                <div class="pt-2 border-t border-gray-800 space-y-2">
                    <label class="block text-[11px] font-mono text-cyan-400 uppercase tracking-wider">Quick Snapshot (Slot No: 1 - 6)</label>
                    <div class="flex space-x-2">
                        <input type="number" id="snapshot-slot" min="1" max="6" value="1" class="w-16 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white font-mono text-center text-sm focus:outline-none">
                        <button onclick="takeSnapshot()" class="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl transition text-xs flex items-center justify-center space-x-2 border border-gray-700 font-bold">
                            <i class="fa-solid fa-camera"></i> <span>Save Snapshot</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right / 6-Camera Grid Display Panel -->
        <div class="glass-panel rounded-2xl p-4 md:p-6 flex flex-col lg:col-span-3">
            <h2 class="cyber-font text-sm font-semibold text-cyan-300 mb-4 flex items-center justify-between">
                <span><i class="fa-solid fa-video mr-2"></i> Live Feeds Grid (Cam 1 - Cam 6)</span>
                <span class="text-xs text-gray-400 font-mono">Status: <span id="grid-status" class="text-emerald-400">Standby</span></span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 flex-1">
                <!-- Camera Slot 1 to 6 -->
                <script>
                    for(let i=1; i<=6; i++) {
                        document.write(`
                            <div class="relative rounded-xl overflow-hidden bg-gray-950 border border-gray-800 min-h-[220px] flex items-center justify-center">
                                <div id="placeholder-${i}" class="text-center p-4">
                                    <i class="fa-solid fa-video-slash text-3xl text-gray-700 mb-2"></i>
                                    <p class="text-gray-500 text-xs font-mono">CAM ${i} (cam-${i})</p>
                                </div>
                                <video id="video-${i}" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                                <div class="absolute top-2 left-2 bg-black/60 px-2 py-0.5 rounded text-[10px] font-mono text-cyan-400 border border-white/10">CAM ${i}</div>
                            </div>
                        `);
                    }
                </script>
            </div>
        </div>
    </main>

    <!-- Hidden Media Elements -->
    <video id="local-video" autoplay playsinline muted class="hidden"></video>
    <audio id="silent-audio" loop class="hidden">
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
    </audio>

    <!-- App Logic Script -->
    <script>
        let peer = null;
        let myStream = null;
        let currentFacingMode = 'environment';
        let silentAudioCtx = null;
        const camIds = ['cam-1', 'cam-2', 'cam-3', 'cam-4', 'cam-5', 'cam-6'];

        // Robust Peer Initialization with Google STUN servers and Auto-Reconnect
        function initPeer(customId = null) {
            if (peer) {
                try { peer.destroy(); } catch(e) {}
            }

            const peerOptions = {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            };

            peer = customId ? new Peer(customId, peerOptions) : new Peer(peerOptions);

            peer.on('open', (id) => {
                updateStatus('Cloud Connected: ' + id, 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30');
            });

            peer.on('disconnected', () => {
                updateStatus('Disconnected! Reconnecting...', 'bg-yellow-500/10 text-yellow-400 border-yellow-500/30');
                setTimeout(() => {
                    if (peer && peer.disconnected) {
                        peer.reconnect();
                    }
                }, 3000);
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'unavailable-id') {
                    alert("මෙම ID එක දැනටමත් භාවිතයේ ඇත. කරුණාකර වෙනත් නමක් දෙන්න (උදා: cam-2).");
                }
                updateStatus('Error: ' + err.type, 'bg-red-500/10 text-red-400 border-red-500/30');
            });

            peer.on('call', (call) => {
                if (myStream) {
                    call.answer(myStream);
                } else {
                    // Answer with empty stream if local stream is not yet ready
                    call.answer(new MediaStream());
                }
            });
        }

        function registerCustomId() {
            const customId = document.getElementById('custom-my-id').value.trim();
            if (!customId) {
                alert("Please enter a valid Camera ID!");
                return;
            }
            initPeer(customId);
        }

        function updateStatus(text, cssClass) {
            const badge = document.getElementById('connection-status');
            badge.className = `text-xs font-mono px-3 py-1 rounded-full border ${cssClass}`;
            badge.innerText = text;
        }

        function switchMode(mode) {
            const tabCam = document.getElementById('tab-cam');
            const tabViewer = document.getElementById('tab-viewer');
            const secCam = document.getElementById('section-cam');
            const secViewer = document.getElementById('section-viewer');

            if (mode === 'cam') {
                tabCam.className = "py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg";
                tabViewer.className = "py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white";
                secCam.classList.remove('hidden');
                secViewer.classList.add('hidden');
            } else {
                tabViewer.className = "py-2 rounded-lg text-xs font-medium transition-all bg-cyan-500 text-gray-950 font-bold shadow-lg";
                tabCam.className = "py-2 rounded-lg text-xs font-medium transition-all text-gray-400 hover:text-white";
                secViewer.classList.remove('hidden');
                secCam.classList.add('hidden');
            }
        }

        async function startCamera() {
            try {
                if (myStream) {
                    myStream.getTracks().forEach(track => track.stop());
                }

                myStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });

                document.getElementById('local-video').srcObject = myStream;
                playSilentAudio();

                alert("Camera Started Successfully! You can now minimize the browser.");
            } catch (err) {
                console.error(err);
                alert("Camera Error: " + err.message);
            }
        }

        function playSilentAudio() {
            const audioEl = document.getElementById('silent-audio');
            audioEl.play().catch(e => console.log("Audio autoplay restricted:", e));

            if (!silentAudioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                silentAudioCtx = new AudioContext();
                const oscillator = silentAudioCtx.createOscillator();
                const gainNode = silentAudioCtx.createGain();
                gainNode.gain.value = 0.01;
                oscillator.connect(gainNode);
                gainNode.connect(silentAudioCtx.destination);
                oscillator.start();
            }
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            if (myStream) {
                await startCamera();
            }
        }

        // Improved multi-cam connection loop with retry mechanism
        async function connectAllCams() {
            document.getElementById('grid-status').innerText = "Connecting 6 Cams...";
            
            let dummyStream;
            try {
                dummyStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch(e) {
                dummyStream = new MediaStream();
            }

            camIds.forEach((id, index) => {
                const slotNum = index + 1;
                
                // Attempt call
                try {
                    const call = peer.call(id, dummyStream);
                    if (call) {
                        call.on('stream', (remoteStream) => {
                            showStreamInSlot(slotNum, remoteStream);
                        });
                        call.on('error', (err) => {
                            console.log(`Cam ${slotNum} error:`, err);
                        });
                    }
                } catch(err) {
                    console.log(`Failed to call ${id}:`, err);
                }
            });

            document.getElementById('grid-status').innerText = "Monitoring Active";
        }

        function showStreamInSlot(slotNum, stream) {
            const videoEl = document.getElementById(`video-${slotNum}`);
            const placeholderEl = document.getElementById(`placeholder-${slotNum}`);
            
            if (videoEl && placeholderEl) {
                videoEl.srcObject = stream;
                videoEl.classList.remove('hidden');
                placeholderEl.classList.add('hidden');
            }
        }

        function takeSnapshot() {
            const slotNum = document.getElementById('snapshot-slot').value;
            const videoEl = document.getElementById(`video-${slotNum}`);
            
            if (!videoEl || videoEl.classList.contains('hidden')) {
                alert(`Slot ${slotNum} හි සජීවී කැමරාවක් ක්‍රියාත්මක නැත!`);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = videoEl.videoWidth || 1280;
            canvas.height = videoEl.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = `cctv-cam-${slotNum}-snapshot-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Initialize default ID on load
        window.onload = () => {
            initPeer('cam-1');
        };
    </script>
</body>
</html>
